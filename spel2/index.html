<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<title>🚀 Space Shooter Pro</title>

<style>
body{
    margin:0;
    overflow:hidden;
    background:black;
    font-family:Arial;
}

canvas{
    display:block;
}

/* GAME OVER SCREEN */
#gameOverScreen{
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.85);
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    color:white;
    font-size:48px;
    opacity:0;
    pointer-events:none;
    transition:opacity .5s;
}

#gameOverScreen.show{
    opacity:1;
    pointer-events:auto;
}

#restartBtn{
    margin-top:20px;
    padding:10px 20px;
    font-size:20px;
    cursor:pointer;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="gameOverScreen">
    🚀 GAME OVER
    <div style="font-size:24px;margin-top:10px">
        Poäng: <span id="finalScore"></span>
    </div>
    <button id="restartBtn">Spela igen</button>
</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let score=0;
let lives=3;
let gameRunning=true;

let keys={};
let bullets=[];
let asteroids=[];
let particles=[];

/* ===== PLAYER ===== */
const player={
    x:canvas.width/2,
    y:canvas.height-100,
    size:30,
    speed:6
};

window.addEventListener("keydown",e=>keys[e.key]=true);
window.addEventListener("keyup",e=>keys[e.key]=false);

window.addEventListener("keydown",e=>{
    if(e.code==="Space" && gameRunning){
        bullets.push({x:player.x,y:player.y,size:5});
    }
});

/* ===== ASTEROIDS ===== */
function spawnAsteroid(){
    asteroids.push({
        x:Math.random()*canvas.width,
        y:-50,
        size:30+Math.random()*25,
        speed:2+Math.random()*2,
        angle:0,
        rotation:(Math.random()-.5)*0.05
    });
}
setInterval(spawnAsteroid,900);

/* ===== UPDATE ===== */
function update(){

if(!gameRunning) return;

/* Movement */
if(keys["ArrowLeft"] && player.x>0)
    player.x-=player.speed;

if(keys["ArrowRight"] && player.x<canvas.width)
    player.x+=player.speed;

/* Bullets */
for(let i=bullets.length-1;i>=0;i--){
    bullets[i].y-=8;
    if(bullets[i].y<0)
        bullets.splice(i,1);
}

/* Asteroids */
for(let i=asteroids.length-1;i>=0;i--){
    let a=asteroids[i];
    a.y+=a.speed;
    a.angle+=a.rotation;

    if(a.y>canvas.height){
        asteroids.splice(i,1);
        lives--;
        if(lives<=0) gameOver();
    }
}

/* Collisions */
for(let i=asteroids.length-1;i>=0;i--){
    for(let j=bullets.length-1;j>=0;j--){
        let dx=asteroids[i].x-bullets[j].x;
        let dy=asteroids[i].y-bullets[j].y;
        let dist=Math.sqrt(dx*dx+dy*dy);

        if(dist<asteroids[i].size){
            createExplosion(asteroids[i].x,asteroids[i].y);
            asteroids.splice(i,1);
            bullets.splice(j,1);
            score+=10;
            break;
        }
    }
}

/* Particles */
for(let i=particles.length-1;i>=0;i--){
    particles[i].x+=particles[i].vx;
    particles[i].y+=particles[i].vy;
    particles[i].life--;
    if(particles[i].life<=0)
        particles.splice(i,1);
}
}

/* ===== DRAW ===== */
function draw(){

ctx.clearRect(0,0,canvas.width,canvas.height);

/* PLAYER (realistic triangle ship) */
ctx.save();
ctx.translate(player.x,player.y);
ctx.fillStyle="cyan";
ctx.beginPath();
ctx.moveTo(0,-player.size);
ctx.lineTo(player.size/2,player.size);
ctx.lineTo(-player.size/2,player.size);
ctx.closePath();
ctx.fill();
ctx.restore();

/* Bullets */
ctx.fillStyle="yellow";
bullets.forEach(b=>{
    ctx.beginPath();
    ctx.arc(b.x,b.y,b.size,0,Math.PI*2);
    ctx.fill();
});

/* Asteroids */
asteroids.forEach(a=>{
    ctx.save();
    ctx.translate(a.x,a.y);
    ctx.rotate(a.angle);
    ctx.fillStyle="#666";
    ctx.beginPath();
    ctx.arc(0,0,a.size,0,Math.PI*2);
    ctx.fill();

    /* craters */
    ctx.fillStyle="#444";
    ctx.beginPath();
    ctx.arc(-a.size/3,-a.size/4,a.size/4,0,Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(a.size/4,a.size/5,a.size/5,0,Math.PI*2);
    ctx.fill();

    ctx.restore();
});

/* Particles */
particles.forEach(p=>{
    ctx.fillStyle="orange";
    ctx.fillRect(p.x,p.y,3,3);
});
}

/* ===== EXPLOSION ===== */
function createExplosion(x,y){
    for(let i=0;i<25;i++){
        particles.push({
            x:x,
            y:y,
            vx:(Math.random()-0.5)*6,
            vy:(Math.random()-0.5)*6,
            life:30
        });
    }
}

/* ===== GAME LOOP ===== */
function loop(){
    update();
    draw();
    requestAnimationFrame(loop);
}
loop();

/* ===== GAME OVER ===== */
function gameOver(){
    gameRunning=false;
    document.getElementById("finalScore").textContent=score;
    document.getElementById("gameOverScreen").classList.add("show");
}

document.getElementById("restartBtn").onclick=()=>{
    location.reload();
};
</script>

</body>
</html>
