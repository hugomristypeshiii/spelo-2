<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<title>🚀 Space Shooter Pro</title>
<style>
body{
    margin:0;
    overflow:hidden;
    background:black;
    font-family:Arial;
    color:white;
}

canvas{
    display:block;
    background:linear-gradient(#000015,#000);
}

.ui{
    position:absolute;
    top:10px;
    left:10px;
    font-size:18px;
}
</style>
</head>
<body>

<canvas id="game"></canvas>

<div class="ui">
    ❤️ Liv: <span id="lives">3</span> |
    ⭐ Poäng: <span id="score">0</span>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let score = 0;
let lives = 3;
let keys = {};
let lastTime = 0;

/* ===== PLAYER ===== */
const player = {
    x: canvas.width/2 - 25,
    y: canvas.height - 80,
    w: 50,
    h: 50,
    speed: 6
};

/* ===== OBJECT ARRAYS ===== */
const bullets = [];
const enemies = [];

/* ===== INPUT ===== */
window.addEventListener("keydown", e => keys[e.key] = true);
window.addEventListener("keyup", e => keys[e.key] = false);

/* ===== SHOOT ===== */
function shoot(){
    bullets.push({
        x: player.x + player.w/2 - 3,
        y: player.y,
        w: 6,
        h: 15,
        speed: 8
    });
}

window.addEventListener("keydown", e=>{
    if(e.code==="Space") shoot();
});

/* ===== SPAWN ENEMIES ===== */
function spawnEnemy(){
    enemies.push({
        x: Math.random()*(canvas.width-40),
        y: -40,
        w: 40,
        h: 40,
        speed: 2 + Math.random()*2
    });
}

setInterval(spawnEnemy, 900);

/* ===== UPDATE ===== */
function update(delta){

    /* Player movement */
    if(keys["ArrowLeft"] && player.x > 0)
        player.x -= player.speed;

    if(keys["ArrowRight"] && player.x + player.w < canvas.width)
        player.x += player.speed;

    /* Bullets */
    for(let i=bullets.length-1;i>=0;i--){
        bullets[i].y -= bullets[i].speed;
        if(bullets[i].y < -20)
            bullets.splice(i,1);
    }

    /* Enemies */
    for(let i=enemies.length-1;i>=0;i--){
        enemies[i].y += enemies[i].speed;

        if(enemies[i].y > canvas.height){
            enemies.splice(i,1);
            lives--;
            document.getElementById("lives").textContent=lives;
            if(lives<=0) gameOver();
        }
    }

    /* Collisions */
    for(let i=enemies.length-1;i>=0;i--){
        for(let j=bullets.length-1;j>=0;j--){
            if(
                bullets[j].x < enemies[i].x + enemies[i].w &&
                bullets[j].x + bullets[j].w > enemies[i].x &&
                bullets[j].y < enemies[i].y + enemies[i].h &&
                bullets[j].y + bullets[j].h > enemies[i].y
            ){
                enemies.splice(i,1);
                bullets.splice(j,1);
                score += 10;
                document.getElementById("score").textContent=score;
                break;
            }
        }
    }
}

/* ===== DRAW ===== */
function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);

    /* Player */
    ctx.fillStyle="cyan";
    ctx.fillRect(player.x,player.y,player.w,player.h);

    /* Bullets */
    ctx.fillStyle="yellow";
    bullets.forEach(b=>ctx.fillRect(b.x,b.y,b.w,b.h));

    /* Enemies */
    ctx.fillStyle="red";
    enemies.forEach(e=>ctx.fillRect(e.x,e.y,e.w,e.h));
}

/* ===== GAME LOOP ===== */
function gameLoop(timestamp){
    const delta = timestamp - lastTime;
    lastTime = timestamp;

    update(delta);
    draw();

    requestAnimationFrame(gameLoop);
}

/* ===== GAME OVER ===== */
function gameOver(){
    alert("Game Over! Poäng: "+score);
    location.reload();
}

requestAnimationFrame(gameLoop);
</script>

</body>
</html>
