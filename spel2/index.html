<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<title>🚀 Space Shooter</title>

<style>
body{
    margin:0;
    background:black;
    font-family:Arial;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    flex-direction:column;
}

/* GAME CONTAINER */
#gameContainer{
    position:relative;
}

canvas{
    background:linear-gradient(#000015,#000);
    border:2px solid cyan;
}

/* UI */
.ui{
    text-align:center;
    margin-bottom:10px;
    font-size:18px;
}

#gameOverScreen{
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.9);
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    font-size:32px;
    opacity:0;
    pointer-events:none;
    transition:.5s;
}

#gameOverScreen.show{
    opacity:1;
    pointer-events:auto;
}

button{
    margin-top:15px;
    padding:8px 18px;
    font-size:16px;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="ui">
    ❤️ Liv: <span id="livesDisplay"></span> |
    ⭐ Poäng: <span id="scoreDisplay">0</span> |
    🏆 Highscore: <span id="highscoreDisplay">0</span>
</div>

<div id="gameContainer">
    <canvas id="game" width="600" height="700"></canvas>

    <div id="gameOverScreen">
        GAME OVER
        <div style="font-size:18px;margin-top:10px">
            Poäng: <span id="finalScore"></span><br>
            Highscore: <span id="finalHighscore"></span>
        </div>
        <button onclick="location.reload()">Spela igen</button>
    </div>
</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let score=0;
let lives=5;
let gameRunning=true;

let highscore=localStorage.getItem("spaceHighscore") || 0;
document.getElementById("highscoreDisplay").textContent=highscore;

let keys={}, bullets=[], asteroids=[], particles=[];

/* ===== PLAYER ===== */
const player={
    x:canvas.width/2,
    y:canvas.height-80,
    size:20,
    speed:6
};

window.addEventListener("keydown",e=>keys[e.key]=true);
window.addEventListener("keyup",e=>keys[e.key]=false);

window.addEventListener("keydown",e=>{
    if(e.code==="Space" && gameRunning){
        bullets.push({x:player.x,y:player.y,size:3});
    }
});

/* ===== ASTEROIDS (easier scale) ===== */
function spawnAsteroid(){
    if(!gameRunning) return;
    asteroids.push({
        x:Math.random()*canvas.width,
        y:-30,
        size:15+Math.random()*15,
        speed:1.5+Math.random()*1.5,
        angle:0,
        rotation:(Math.random()-.5)*0.05
    });
}
setInterval(spawnAsteroid,1200);

/* ===== UPDATE ===== */
function update(){
if(!gameRunning) return;

if(keys["ArrowLeft"] && player.x>0)
    player.x-=player.speed;

if(keys["ArrowRight"] && player.x<canvas.width)
    player.x+=player.speed;

/* Bullets */
for(let i=bullets.length-1;i>=0;i--){
    bullets[i].y-=8;
    if(bullets[i].y<0) bullets.splice(i,1);
}

/* Asteroids */
for(let i=asteroids.length-1;i>=0;i--){
    let a=asteroids[i];
    a.y+=a.speed;
    a.angle+=a.rotation;

    if(a.y>canvas.height){
        asteroids.splice(i,1);
        lives--;
        updateLives();
        if(lives<=0) gameOver();
    }
}

/* Collisions */
for(let i=asteroids.length-1;i>=0;i--){
    for(let j=bullets.length-1;j>=0;j--){
        let dx=asteroids[i].x-bullets[j].x;
        let dy=asteroids[i].y-bullets[j].y;
        let dist=Math.sqrt(dx*dx+dy*dy);

        if(dist<asteroids[i].size){
            createExplosion(asteroids[i].x,asteroids[i].y);
            asteroids.splice(i,1);
            bullets.splice(j,1);
            score+=10;
            document.getElementById("scoreDisplay").textContent=score;
            break;
        }
    }
}

/* Particles */
for(let i=particles.length-1;i>=0;i--){
    particles[i].x+=particles[i].vx;
    particles[i].y+=particles[i].vy;
    particles[i].life--;
    if(particles[i].life<=0)
        particles.splice(i,1);
}
}

/* ===== DRAW ===== */
function draw(){
ctx.clearRect(0,0,canvas.width,canvas.height);

/* Ship */
ctx.save();
ctx.translate(player.x,player.y);
ctx.fillStyle="cyan";
ctx.beginPath();
ctx.moveTo(0,-player.size);
ctx.lineTo(player.size/2,player.size);
ctx.lineTo(-player.size/2,player.size);
ctx.closePath();
ctx.fill();
ctx.restore();

/* Bullets */
ctx.fillStyle="yellow";
bullets.forEach(b=>{
    ctx.beginPath();
    ctx.arc(b.x,b.y,b.size,0,Math.PI*2);
    ctx.fill();
});

/* Asteroids */
ctx.fillStyle="#777";
asteroids.forEach(a=>{
    ctx.save();
    ctx.translate(a.x,a.y);
    ctx.rotate(a.angle);
    ctx.beginPath();
    ctx.arc(0,0,a.size,0,Math.PI*2);
    ctx.fill();
    ctx.restore();
});

/* Explosion */
ctx.fillStyle="orange";
particles.forEach(p=>{
    ctx.fillRect(p.x,p.y,3,3);
});
}

/* ===== EXPLOSION ===== */
function createExplosion(x,y){
    for(let i=0;i<15;i++){
        particles.push({
            x,y,
            vx:(Math.random()-.5)*4,
            vy:(Math.random()-.5)*4,
            life:20
        });
    }
}

/* ===== LIVES ===== */
function updateLives(){
    document.getElementById("livesDisplay").textContent="❤️".repeat(lives);
}
updateLives();

/* ===== LOOP ===== */
function loop(){
    update();
    draw();
    requestAnimationFrame(loop);
}
loop();

/* ===== GAME OVER ===== */
function gameOver(){
    gameRunning=false;

    if(score>highscore){
        highscore=score;
        localStorage.setItem("spaceHighscore",highscore);
    }

    document.getElementById("finalScore").textContent=score;
    document.getElementById("finalHighscore").textContent=highscore;
    document.getElementById("gameOverScreen").classList.add("show");
}
</script>

</body>
</html>
